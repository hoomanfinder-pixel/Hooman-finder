name: Read-only DACC Urgency Source Check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: read-only-dacc-urgency-source-check
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Check DACC urgency source fields (read only)
        env:
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: node scripts/dry-run-rescuegroups-urgency-source.cjs --org-id=8883
