name: Discover Shelter Logos

on:
  # Intended daily schedule after the 11:00 UTC shelter ingestion. Keep paused
  # until the migration and a small production apply canary have been reviewed.
  # schedule:
  #   - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Persist reviewed high-confidence results"
        required: true
        type: boolean
        default: false
      limit:
        description: "Maximum shelters to inspect"
        required: true
        default: 20
        type: number

permissions:
  contents: read

concurrency:
  group: shelter-logo-discovery
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm ci
      - name: Discover and validate shelter logos
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SHELTER_LOGO_WRITES_ENABLED: ${{ (github.event_name == 'schedule' || inputs.apply) && 'true' || 'false' }}
        run: >-
          node scripts/discover-shelter-logos.cjs
          --limit="${{ inputs.limit }}"
          --concurrency=3
          ${{ (github.event_name == 'schedule' || inputs.apply) && '--apply' || '' }}
