name: Sync RescueGroups Dogs

on:
  schedule:
    # Runs every day at 7:00 AM Eastern during daylight saving time.
    # GitHub Actions uses UTC, so 11:00 UTC = 7:00 AM EDT.
    - cron: "0 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dog-refresh
  cancel-in-progress: false

jobs:
  sync-dogs:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run RescueGroups dog sync
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: node sync-rescuegroups-dogs.cjs

      - name: Run AI dog trait enrichment
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Drain only the script's existing eligible public/adoptable queue in
        # bounded batches. The script retries an individual failed dog at most
        # three times, stops after 20 batches, and exits non-zero rather than
        # silently leaving a repeatedly failing queue behind.
        run: >-
          node scripts/enrich-dogs-ai.cjs
          --drain
          --limit=25
          --max-batches=20
          --max-attempts=3
          --retry-delay-ms=5000

      - name: Regenerate dog sitemap
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-dog-sitemap.cjs

      - name: Commit updated sitemap if changed
        run: |
          if ! git diff --quiet -- public/sitemap.xml public/dog-sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml public/dog-sitemap.xml
            git commit -m "Auto-update dog sitemap [skip ci]"
            git push
          else
            echo "Dog sitemap unchanged, nothing to commit."
          fi
