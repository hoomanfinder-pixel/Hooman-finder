name: Sync RescueGroups Dogs

on:
  schedule:
    # Runs every day at 7:00 AM Eastern during daylight saving time.
    # GitHub Actions uses UTC, so 11:00 UTC = 7:00 AM EDT.
    - cron: "0 11 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dog-refresh
  cancel-in-progress: false

jobs:
  sync-dogs:
    runs-on: macos-15-intel
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Run RescueGroups dog sync
        id: rescuegroups_sync
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: node sync-rescuegroups-dogs.cjs

      - name: Run DACC ShelterManager bio enrichment
        # Only runs once the primary sync above has succeeded (default GitHub
        # Actions step ordering). continue-on-error is intentional: a
        # ShelterManager outage must not block AI enrichment or the sitemap
        # step for every other shelter — the script itself never blanks or
        # overwrites an existing description on failure, so degrading
        # gracefully here is safe. See scripts/enrich-dacc-bios.cjs.
        if: steps.rescuegroups_sync.outcome == 'success'
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESCUEGROUPS_API_KEY: ${{ secrets.RESCUEGROUPS_API_KEY }}
        run: node scripts/enrich-dacc-bios.cjs --confirm

      - name: Run AI dog trait enrichment
        if: steps.rescuegroups_sync.outcome == 'success'
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        # Drain only the script's existing eligible public/adoptable queue in
        # bounded batches. The script retries an individual failed dog at most
        # three times, stops after 20 batches, and exits non-zero rather than
        # silently leaving a repeatedly failing queue behind.
        run: >-
          node scripts/enrich-dogs-ai.cjs
          --drain
          --limit=25
          --max-batches=20
          --max-attempts=3
          --retry-delay-ms=5000

      - name: Regenerate dog sitemap
        if: always()
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/generate-dog-sitemap.cjs

      - name: Commit updated sitemap and platform stats if changed
        if: always()
        run: |
          if ! git diff --quiet -- public/sitemap.xml public/dog-sitemap.xml src/generated/platform-stats.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add public/sitemap.xml public/dog-sitemap.xml src/generated/platform-stats.json
            git commit -m "Auto-update public dog artifacts [skip ci]"
            git push
          else
            echo "Public dog artifacts unchanged, nothing to commit."
          fi

      - name: Fail workflow if RescueGroups sync failed
        if: always() && steps.rescuegroups_sync.outcome != 'success'
        run: exit 1
