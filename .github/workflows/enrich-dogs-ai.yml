name: Enrich Dog Profiles with AI

on:
  schedule:
    - cron: "0 13 * * *"

  workflow_dispatch:
    inputs:
      enabled:
        description: Run enrichment
        required: true
        type: boolean
        default: true
      batch_size:
        description: Dogs per bounded batch (1-100)
        required: true
        type: number
        default: 25
      max_batches:
        description: Maximum batches to drain (1-20)
        required: true
        type: number
        default: 4

permissions:
  contents: read

concurrency:
  group: ai-dog-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: vars.AI_ENRICHMENT_ENABLED != 'false' && (github.event_name != 'workflow_dispatch' || inputs.enabled)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Enrich a bounded number of eligible dogs
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_ENRICHMENT_ENABLED: "true"
          BATCH_SIZE: ${{ github.event_name == 'workflow_dispatch' && inputs.batch_size || 25 }}
          MAX_BATCHES: ${{ github.event_name == 'workflow_dispatch' && inputs.max_batches || 4 }}
        run: node scripts/enrich-dogs-ai.cjs --drain --limit="$BATCH_SIZE" --max-batches="$MAX_BATCHES" --max-attempts=3
