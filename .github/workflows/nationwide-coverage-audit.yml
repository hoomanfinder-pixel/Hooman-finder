name: Nationwide Matching Coverage Audit

on:
  schedule:
    # Run after the Monday daily sync and production monitor have completed.
    - cron: "17 16 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: nationwide-coverage-audit
  cancel-in-progress: false

jobs:
  audit:
    name: Read-only nationwide coverage report
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compute report compatibility key
        id: revisions
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import { getCoverageReportRevisions } from "./scripts/nationwideCoverageReport.mjs"; const r = getCoverageReportRevisions(); const key = `nationwide-coverage-v${r.report_version}-${r.matcher_revision.slice(0, 12)}-${r.profile_set_version.slice(0, 12)}-${r.report_definition_revision.slice(0, 12)}`; fs.appendFileSync(process.env.GITHUB_OUTPUT, `key=${key}\n`);'

      - name: Find latest valid comparable report artifact
        id: previous
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = `${process.env.COVERAGE_ARTIFACT_KEY}-`;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'nationwide-coverage-audit.yml',
              status: 'success',
              per_page: 100,
            });
            for (const run of data.workflow_runs || []) {
              if (run.id === context.runId) continue;
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
                per_page: 100,
              });
              const artifact = (result.data.artifacts || []).find((item) =>
                !item.expired && item.name.startsWith(prefix)
              );
              if (artifact) {
                core.setOutput('run_id', String(run.id));
                core.setOutput('run_attempt', String(run.run_attempt || 1));
                core.setOutput('artifact_name', artifact.name);
                return;
              }
            }
            core.info('No report with matching report, matcher, profile, and definition revisions was found.');
        env:
          COVERAGE_ARTIFACT_KEY: ${{ steps.revisions.outputs.key }}

      - name: Download latest comparable aggregate report
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.previous.outputs.artifact_name }}
          path: coverage-previous
          run-id: ${{ steps.previous.outputs.run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}

      - name: Run read-only nationwide coverage audit
        id: audit
        continue-on-error: true
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: >-
          node scripts/audit-match-coverage.mjs --mode=nationwide
          --json=coverage-output/report.json
          --markdown=coverage-output/report.md
          --previous=coverage-previous/report.json

      - name: Add founder summary to run
        if: always()
        run: |
          if [ -f coverage-output/report.md ]; then
            cat coverage-output/report.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Coverage report was not created; coverage is unverified." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload aggregate-only coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.audit.outputs.artifact_key }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            coverage-output/report.json
            coverage-output/report.md
          if-no-files-found: error
          retention-days: 90

      - name: Fail visibly when inventory is unverified
        if: always() && (steps.audit.outcome == 'failure' || steps.audit.outputs.verification_status != 'verified')
        run: exit 1
